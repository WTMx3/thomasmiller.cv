document:
  id: cover-letter
  label: Cover letter
  description: A concise introduction and statement of interest.
  file: wtm3-cover-letter.pdf
  order: 1

coverLetter:
  salutation: Dear Hiring Team,
  paragraphs:
    - >-
      I am an experienced software engineer with countless real-world hours of experience,
      searching to further my career in technology. I am excited to tackle any role or task I am presented with.
      I want to emphasize my eagerness to tackle new challenges, and my competitive drive.
    - >-
      In my current position, I own the complete software product lifecycle across web, mobile,
      cloud, DevOps, reliability, and security. I lead work from early planning and architecture
      through implementation, release, monitoring, support, and continuous improvement.
      I regularly interact with clients and stakeholders, finding solutions for their problems,
       and bringing value and change to their organizations.
    - >-
      I would welcome the opportunity to discuss how that combination could support your
      products, engineering organization, and customers. Thank you for your consideration.
  closing: Sincerely,
