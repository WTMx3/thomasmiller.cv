document:
  id: cover-letter
  label: Cover letter
  description: A concise introduction and statement of interest.
  file: wtm3-cover-letter.pdf
  order: 1

coverLetter:
  salutation: Dear Hiring Team,
  paragraphs:
    - >-
      I am a software engineer with more than 10 years of experience building full-stack
      products and reliable platforms. I am seeking a role where I can combine hands-on
      development with technical leadership and help a team deliver measurable results.
    - >-
      In my current position, I guide products from client discovery and architecture
      through implementation, deployment, monitoring, and support. My work spans web and
      mobile applications, cloud infrastructure, DevOps, reliability, and security. I work
      directly with clients and stakeholders to turn their requirements into practical solutions.
    - >-
      I would welcome the opportunity to discuss how this experience could support your
      products, engineering team, and customers. Thank you for your consideration.
  closing: Sincerely,
