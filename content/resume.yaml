coverLetter:
  salutation: Dear Hiring Team,
  paragraphs:
    - >-
      I am a senior software engineer who turns ambiguous product needs into dependable systems.
      My work spans product and platform engineering: customer-facing applications, APIs,
      cloud infrastructure, delivery automation, observability, and the operating practices
      that keep software healthy after launch.
    - >-
      At BAAS Software, I own the complete software product lifecycle across web, mobile,
      cloud, DevOps, reliability, and security. I lead work from early planning and architecture
      through implementation, release, monitoring, support, and continuous improvement.
    - >-
      Earlier roles strengthened my experience in enterprise reliability, incident response,
      quality engineering, accessible interfaces, and client-focused delivery. I am most
      valuable where a team needs both breadth and follow-through: someone who can shape
      the architecture, write the software, improve the path to production, and remain
      accountable for the result in operation.
    - >-
      I would welcome the opportunity to discuss how that combination could support your
      products, engineering organization, and customers. Thank you for your consideration.
  closing: Sincerely,
